
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaxGuard AI - Tax Compliance</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Arial,sans-serif;
 background:#0b1220;color:#e8eef8;
}
header{
 padding:25px;background:#111c30;
 border-bottom:1px solid #263750;
}
header h1{margin:0;color:#45d6a0}
header p{color:#a8b6ca}
.container{max-width:1100px;margin:auto;padding:22px}
.cards{
 display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
 gap:15px;margin-bottom:25px
}
.card{
 background:#15233a;padding:20px;border-radius:12px;
 border:1px solid #263750
}
.card small{color:#a8b6ca}
.card h2{color:#45d6a0;margin-bottom:0}
.panel{
 background:#15233a;padding:22px;border-radius:12px;
 margin-bottom:22px;border:1px solid #263750
}
input,select,button{
 padding:12px;border-radius:7px;border:1px solid #344863;
 margin:5px 0;background:#0d192b;color:white;
}
input,select{width:100%}
button{
 background:#13a77a;border:0;cursor:pointer;
 font-weight:bold;padding:12px 18px
}
button:hover{background:#0e8965}
.delete{background:#b83c4b}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{padding:12px;text-align:left;border-bottom:1px solid #344863}
th{color:#45d6a0}
.status{color:#45d6a0}
.warning{color:#ffbd59}
#result{margin-top:15px;padding:15px;border-radius:8px}
@media(max-width:600px){
 table{font-size:12px}
 th,td{padding:7px}
 .container{padding:12px}
}
</style>
</head>
<body>

<header>
<h1>🛡️ TaxGuard AI</h1>
<p>Smart Tax Compliance Monitoring System</p>
</header>

<div class="container">

<div class="cards">
<div class="card">
<small>Total Transactions</small>
<h2 id="total">0</h2>
</div>
<div class="card">
<small>Total Revenue</small>
<h2 id="revenue">$0</h2>
</div>
<div class="card">
<small>Total Tax</small>
<h2 id="tax">$0</h2>
</div>
<div class="card">
<small>Compliance Rate</small>
<h2 id="compliance">100%</h2>
</div>
</div>

<div class="panel">
<h2>➕ Add New Transaction</h2>

<label>Transaction Name</label>
<input id="name" placeholder="Enter transaction name">

<label>Amount ($)</label>
<input id="amount" type="number" min="0" placeholder="Enter amount">

<label>Tax Rate</label>
<select id="rate">
<option value="19">19%</option>
<option value="9">9%</option>
<option value="0">0%</option>
</select>

<button onclick="addTransaction()">Add Transaction</button>
<div id="result"></div>
</div>

<div class="panel">
<h2>📊 Transaction History</h2>
<table>
<thead>
<tr>
<th>Name</th>
<th>Amount</th>
<th>Tax</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="transactions"></tbody>
</table>
</div>

<div class="panel">
<h2>🔍 Tax Compliance Analysis</h2>
<p id="analysis">Add transactions to start your analysis.</p>
<button onclick="analyze()">Analyze Transactions</button>
</div>

<div class="panel">
<h2>📥 Export Report</h2>
<button onclick="exportCSV()">Download CSV Report</button>
<button onclick="clearData()" class="delete">Clear All Data</button>
</div>

</div>

<script>
let data = JSON.parse(localStorage.getItem("taxData") || "[]");

function save(){
 localStorage.setItem("taxData",JSON.stringify(data));
 render();
}

function addTransaction(){
 const name=document.getElementById("name").value.trim();
 const amount=Number(document.getElementById("amount").value);
 const rate=Number(document.getElementById("rate").value);

 if(!name || !Number.isFinite(amount) || amount<=0){
  alert("Please enter a valid name and amount.");
  return;
 }

 data.push({
  id:Date.now()+Math.random(),
  name,amount,rate,
  tax:amount*rate/100,
  status:"Recorded"
 });

 document.getElementById("name").value="";
 document.getElementById("amount").value="";
 document.getElementById("result").innerHTML=
 "✅ Transaction added successfully.";

 save();
}

function render(){
 const body=document.getElementById("transactions");
 body.innerHTML="";

 let revenue=0,tax=0;

 data.forEach(t=>{
  revenue+=t.amount;
  tax+=t.tax;

  body.innerHTML+=`
  <tr>
   <td>${escapeHTML(t.name)}</td>
   <td>$${t.amount.toFixed(2)}</td>
   <td>$${t.tax.toFixed(2)}</td>
   <td class="status">${t.status}</td>
   <td><button class="delete" onclick="removeTransaction('${t.id}')">Delete</button></td>
  </tr>`;
 });

 document.getElementById("total").textContent=data.length;
 document.getElementById("revenue").textContent="$"+revenue.toFixed(2);
 document.getElementById("tax").textContent="$"+tax.toFixed(2);
 document.getElementById("compliance").textContent=
 data.length ? "100%" : "—";
}

function escapeHTML(value){
 return String(value).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#39;"
 }[c]));
}

function removeTransaction(id){
 data=data.filter(t=>String(t.id)!==id);
 save();
}

function analyze(){
 const output=document.getElementById("analysis");

 if(!data.length){
  output.textContent="No transactions available for analysis.";
  return;
 }

 let totalTax=data.reduce((s,t)=>s+t.tax,0);
 let zeroTax=data.filter(t=>t.rate===0).length;

 output.innerHTML=`
 <strong class="status">Analysis completed</strong><br><br>
 Total transactions: ${data.length}<br>
 Total calculated tax: $${totalTax.toFixed(2)}<br>
 Zero-rate transactions: ${zeroTax}<br><br>
 <span class="warning">
 Note: This is a basic calculation tool.
 It does not verify legal compliance or detect fraud.
 </span>`;
}

function exportCSV(){
 let csv="Name,Amount,Tax Rate,Tax Amount,Status\n";

 data.forEach(t=>{
  let name='"'+t.name.replace(/"/g,'""')+'"';
  csv+=`${name},${t.amount},${t.rate},${t.tax},${t.status}\n`;
 });

 const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download="TaxGuard_Report.csv";
 a.click();
 URL.revokeObjectURL(url);
}

function clearData(){
 if(confirm("Are you sure you want to delete all transactions?")){
  data=[];
  save();
  document.getElementById("analysis").textContent=
  "Add transactions to start your analysis.";
 }
}

render();
</script>
</body>
</html>
