    body {

    }
    @keyframes pulseShield {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 14px rgba(99, 102, 241, 0.55)); }
      50% { transform: scale(1.07); filter: drop-shadow(0 0 26px rgba(34, 211, 238, 0.75)); }
    }
    @keyframes loadBar {
      0% { width: 0%; }
      100% { width: 100%; }
    }
    .shield-anim { animation: pulseShield 1.8s infinite ease-in-out; }
    .progress-anim { animation: loadBar 2s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>

    function round2(num) {
      return Math.round((Number(num) + Number.EPSILON) * 100) / 100;
    }

      return dict[state.lang];

    function logActivity(msg) {
      state.activities.unshift(msg);
      if (state.activities.length > 20) state.activities.pop();
    }

    // Core fiscal audit engine (solves tax risk & deduction errors beyond plain arithmetic)
    function auditTransaction(item) {
      const beforeTax = Math.max(0, Number(item.beforeTax) || 0);
      const rate = Math.max(0, Number(item.rate) || 0);
      const taxAmount = round2((beforeTax * rate) / 100);
      const totalAmount = round2(beforeTax + taxAmount);

      let risk = 'low';
      let deductibleTax = 0;
      let penaltyExposure = 0;
      let diagnosis = '';

      if (!item.hasInvoice) {
        risk = 'high';
        deductibleTax = 0;
        penaltyExposure = round2(Math.max(taxAmount, beforeTax * 0.1));
        diagnosis = state.lang === 'ar'
          ? 'رفض الخصم: غياب الفاتورة الرسمية يعرّض العملية لعدم الاعتراف الجبائي وغرامة.'
          : 'Deduction rejected: missing official tax invoice creates audit disallowance risk.';
      } else if (item.type === 'personal') {
        risk = 'high';
        deductibleTax = 0;
        penaltyExposure = round2(taxAmount * 0.5);
        diagnosis = state.lang === 'ar'
          ? 'مخالفة قاعدة الخصم: المصاريف الشخصية غير قابلة لاسترجاع TVA أو الخصم الضريبي.'
          : 'Rule violation: personal expenses are non-deductible for tax or VAT recovery.';
      } else if (item.type === 'export' && rate > 0) {
        risk = 'medium';
        deductibleTax = 0;
        penaltyExposure = round2(taxAmount);
        diagnosis = state.lang === 'ar'
          ? 'تنبيه نسبة التصدير: التصدير معفى (0%)؛ احتساب ضريبة 19% قد يربك الإقرار.'
          : 'Export rate warning: exports are typically 0%; charging VAT may distort filing.';
      } else if ((item.type === 'sale' || item.type === 'purchase_op') && rate !== 19 && rate !== 9) {
        risk = 'medium';
        deductibleTax = item.type === 'purchase_op' ? taxAmount : 0;
        penaltyExposure = round2(beforeTax * 0.05);
        diagnosis = state.lang === 'ar'
          ? 'تنبيه نسبة TVA: النسبة المدخلة تختلف عن النسب القياسية (19% أو 9%)؛ يُنصح بالمراجعة.'
          : 'VAT rate alert: rate differs from standard 19% / 9% benchmarks; review recommended.';
      } else if (item.payment === 'cash' && totalAmount > CASH_LIMIT_DZD) {
        risk = 'high';
        deductibleTax = 0;
        penaltyExposure = round2(totalAmount * 0.1);
        diagnosis = state.lang === 'ar'
          ? 'تجاوز سقف الدفع نقداً: المبلغ النقدي يفوق الحد المسموح وقد يُستبعد من الخصم.'
          : 'Cash threshold exceeded: cash settlement above limit risks deduction exclusion.';
      } else {
        risk = 'low';
        deductibleTax = item.type === 'purchase_op' ? taxAmount : 0;
        penaltyExposure = 0;
        diagnosis = state.lang === 'ar'
          ? 'متوافق جبائياً: شروط الفاتورة ونوع العملية ونسبة الضريبة مطابقة للقواعد.'
          : 'Compliant: invoice, transaction type, and tax rate align with active rules.';
      }

      const collectedTax = item.type === 'sale' ? taxAmount : 0;

      return {
        beforeTax: round2(beforeTax),
        rate: round2(rate),
        taxAmount,
        totalAmount,
        deductibleTax,
        collectedTax,
        penaltyExposure,
        risk,
        diagnosis
      };
    }

      } else if (state.page === 'regulations') {
        sectionNote = `
          <section class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-4 text-xs text-slate-600 dark:text-slate-300">
            <strong class="text-slate-900 dark:text-white">${t().labels.regulations}:</strong>
            TVA 19% / 9%، التصدير 0%، استبعاد المصاريف الشخصية أو الفواتير الناقصة أو الدفع النقدي فوق السقف المحدد من الخصم.
          </section>
        `;
      } else if (state.page === 'deadlines') {
        sectionNote = `
          <section class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-4 text-xs text-slate-600 dark:text-slate-300">
            <strong class="text-slate-900 dark:text-white">${t().labels.deadlines}:</strong>
            التصريح الشهري للضرائب والرسوم (G50) يُقدّم قبل يوم 20 من الشهر الموالي لتفادي غرامات التأخير.
          </section>
        `;
      }

      container.innerHTML = renderHome5AndProblemCard() + renderFiscalKPIs() + sectionNote + renderFormAndAuditTable();
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderChrome();
      renderPage();
      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        const app = document.getElementById('app-root');
        splash.style.opacity = '0';
        setTimeout(() => {
          splash.classList.add('hidden');
          app.classList.remove('hidden');
        }, 450);
      }, 2000);
    });
  </script>
</body>
</html>
