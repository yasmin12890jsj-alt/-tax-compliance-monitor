<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaxGuard AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca'
            }
          }
        }
      }
    };
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Cairo', 'Inter', sans-serif;
    }
    @keyframes pulseShield {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 12px rgba(99, 102, 241, 0.55)); }
      50% { transform: scale(1.07); filter: drop-shadow(0 0 24px rgba(34, 211, 238, 0.75)); }
    }
    @keyframes loadBar {
      0% { width: 0%; }
      100% { width: 100%; }
    }
    .shield-anim { animation: pulseShield 1.8s infinite ease-in-out; }
    .progress-anim { animation: loadBar 2s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300">

  <!-- Animated Splash Screen -->
  <div id="splash-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-950 text-white transition-opacity duration-500">
    <div class="shield-anim mb-5 flex h-24 w-24 items-center justify-center rounded-3xl bg-gradient-to-tr from-indigo-600 to-cyan-500 shadow-2xl">
      <svg class="h-14 w-14 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
      </svg>
    </div>
    <h1 class="text-3xl font-extrabold bg-gradient-to-r from-indigo-400 to-cyan-300 bg-clip-text text-transparent">TaxGuard AI</h1>
    <p class="mt-2 text-xs text-slate-400">Tax Compliance Monitoring</p>
    <div class="mt-7 h-1.5 w-52 overflow-hidden rounded-full bg-slate-800">
      <div class="progress-anim h-full rounded-full bg-gradient-to-r from-indigo-500 to-cyan-400"></div>
    </div>
  </div>

  <!-- Main App -->
  <div id="app-root" class="hidden min-h-screen flex flex-col pb-20 md:pb-8">

    <!-- Top Header -->
    <header class="sticky top-0 z-30 border-b border-slate-200 dark:border-slate-800 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md">
      <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3.5 sm:px-6">
        <button onclick="navigateTo('dashboard')" class="flex items-center gap-3 text-start">
          <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-indigo-600 text-white shadow">
            <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
            </svg>
          </div>
          <div>
            <span class="text-base font-extrabold text-slate-900 dark:text-white">TaxGuard AI</span>
            <p id="header-page-title" class="text-xs text-slate-500 dark:text-slate-400">لوحة القيادة</p>
          </div>
        </button>

        <!-- Three-Dot Menu Button (⋮) -->
        <div class="relative">
          <button id="menu-btn" onclick="toggleMenu(event)" aria-label="Menu" class="flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700 transition">
            <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24">
              <circle cx="12" cy="5" r="2" />
              <circle cx="12" cy="12" r="2" />
              <circle cx="12" cy="19" r="2" />
            </svg>
          </button>

          <!-- Dropdown / Drawer Menu -->
          <div id="more-menu" class="invisible opacity-0 scale-95 pointer-events-none fixed md:absolute inset-x-4 md:inset-x-auto top-16 md:top-12 end-auto md:end-0 z-50 w-auto md:w-72 max-h-[80vh] overflow-y-auto rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-2 shadow-2xl transition-all duration-200 origin-top-end">
            <div id="menu-items-container" class="space-y-1"></div>
          </div>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <main id="page-container" class="mx-auto w-full max-w-6xl flex-1 px-4 py-6 sm:px-6 space-y-6"></main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 inset-x-0 z-30 border-t border-slate-200 dark:border-slate-800 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md">
      <div id="bottom-nav" class="mx-auto flex max-w-6xl items-center justify-around px-2 py-2"></div>
    </nav>
  </div>

  <script>
    const state = {
      lang: 'ar',
      currency: 'DZD',
      dark: false,
      page: 'dashboard',
      menuOpen: false,
      vatRate: 19,
      autoAlert: true,
      transactions: [
        { id: 1, title: 'معدات مكتبية', amountUSD: 1400, tax: 19, category: 'operational', compliant: true },
        { id: 2, title: 'فاتورة خدمات استشارية', amountUSD: 2800, tax: 19, category: 'sales', compliant: true },
        { id: 3, title: 'مصروف غير مصنف', amountUSD: 650, tax: 5, category: 'personal', compliant: false }
      ],
      invoices: [
        { id: 'INV-101', client: 'شركة النور التجارية', amountUSD: 2200, status: 'Paid' },
        { id: 'INV-102', client: 'مؤسسة الأفق للخدمات', amountUSD: 1550, status: 'Pending' }
      ],
      activities: [
        'فحص المعاملات مقابل القواعد الضريبية',
        'تحديث عرض لوحة القيادة',
        'تهيئة العملة واللغة'
      ]
    };

    const rates = { DZD: 134.5, USD: 1, EUR: 0.92, SAR: 3.75 };
    const symbols = { DZD: 'د.ج ', USD: '$', EUR: '€', SAR: 'ر.س ' };

    const dict = {
      ar: {
        dir: 'rtl',
        homeTitle: 'الصفحة الرئيسية',
        homeSub: 'اختر إحدى الخدمات الأساسية للبدء مباشرة.',
        main5: {
          dashboard: 'لوحة القيادة',
          transactions: 'المعاملات',
          invoices: 'الفواتير',
          calculator: 'حاسبة الضرائب',
          assistant: 'المساعد الذكي'
        },
        extra12: {
          compliance: 'فاحص الامتثال الضريبي',
          regulations: 'اللوائح الضريبية',
          deadlines: 'تقويم المواعيد الضريبية',
          reports: 'التقارير والتحليلات',
          notifications: 'الإشعارات',
          currency: 'إدارة العملات',
          history: 'سجل النشاطات',
          language: 'اختيار اللغة',
          theme: 'الوضع الليلي / النهاري',
          settings: 'إعدادات التطبيق',
          help: 'مركز المساعدة',
          about: 'حول TaxGuard AI'
        },
        money: (usd) => `${symbols[state.currency]}${(usd * rates[state.currency]).toLocaleString(undefined, { maximumFractionDigits: 2 })}`
      },
      en: {
        dir: 'ltr',
        homeTitle: 'Main Homepage',
        homeSub: 'Select one of the 5 core services to get started.',
        main5: {
          dashboard: 'Dashboard',
          transactions: 'Transactions',
          invoices: 'Invoices',
          calculator: 'Tax Calculator',
          assistant: 'AI Smart Assistant'
        },
        extra12: {
          compliance: 'Tax Compliance Checker',
          regulations: 'Tax Regulations',
          deadlines: 'Tax Deadlines Calendar',
          reports: 'Reports and Analytics',
          notifications: 'Notifications',
          currency: 'Currency Management',
          history: 'Activity History',
          language: 'Language Selection',
          theme: 'Dark Mode / Light Mode',
          settings: 'Application Settings',
          help: 'Help Center',
          about: 'About TaxGuard AI'
        },
        money: (usd) => `${symbols[state.currency]}${(usd * rates[state.currency]).toLocaleString(undefined, { maximumFractionDigits: 2 })}`
      },
      fr: {
        dir: 'ltr',
        homeTitle: 'Accueil Principale',
        homeSub: 'Accédez directement aux 5 services principaux.',
        main5: {
          dashboard: 'Tableau de bord',
          transactions: 'Transactions',
          invoices: 'Factures',
          calculator: 'Calculateur fiscal',
          assistant: 'Assistant IA intelligent'
        },
        extra12: {
          compliance: 'Vérificateur conformité fiscale',
          regulations: 'Réglementations fiscales',
          deadlines: 'Calendrier des échéances',
          reports: 'Rapports et analyses',
          notifications: 'Notifications',
          currency: 'Gestion des devises',
          history: 'Historique des activités',
          language: 'Choix de la langue',
          theme: 'Mode sombre / clair',
          settings: 'Paramètres application',
          help: "Centre d'aide",
          about: 'À propos de TaxGuard AI'
        },
        money: (usd) => `${symbols[state.currency]}${(usd * rates[state.currency]).toLocaleString(undefined, { maximumFractionDigits: 2 })}`
      }
    };

    const extraKeys = [
      'compliance', 'regulations', 'deadlines', 'reports',
      'notifications', 'currency', 'history', 'language',
      'theme', 'settings', 'help', 'about'
    ];

    function t() {
      return dict[state.lang];
    }

    function logActivity(text) {
      state.activities.unshift(text);
      if (state.activities.length > 15) state.activities.pop();
    }

    function toggleMenu(e) {
      if (e) e.stopPropagation();
      state.menuOpen = !state.menuOpen;
      renderMenuVisibility();
    }

    function closeMenu() {
      if (!state.menuOpen) return;
      state.menuOpen = false;
      renderMenuVisibility();
    }

    function renderMenuVisibility() {
      const menu = document.getElementById('more-menu');
      if (state.menuOpen) {
        menu.classList.remove('invisible', 'opacity-0', 'scale-95', 'pointer-events-none');
        menu.classList.add('visible', 'opacity-100', 'scale-100', 'pointer-events-auto');
      } else {
        menu.classList.add('invisible', 'opacity-0', 'scale-95', 'pointer-events-none');
        menu.classList.remove('visible', 'opacity-100', 'scale-100', 'pointer-events-auto');
      }
    }

    document.addEventListener('click', (e) => {
      const menu = document.getElementById('more-menu');
      const btn = document.getElementById('menu-btn');
      if (state.menuOpen && !menu.contains(e.target) && !btn.contains(e.target)) {
        closeMenu();
      }
    });

    function navigateTo(pageKey) {
      state.page = pageKey;
      closeMenu();
      logActivity(t().main5[pageKey] || t().extra12[pageKey] || pageKey);
      renderChrome();
      renderPage();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setLanguage(lang) {
      state.lang = lang;
      document.documentElement.lang = lang;
      document.documentElement.dir = t().dir;
      renderChrome();
      renderPage();
    }

    function setCurrency(curr) {
      state.currency = curr;
      renderPage();
    }

    function toggleTheme() {
      state.dark = !state.dark;
      document.documentElement.classList.toggle('dark', state.dark);
      renderPage();
    }

    function renderChrome() {
      const currentLabel = t().main5[state.page] || t().extra12[state.page] || t().homeTitle;
      document.getElementById('header-page-title').textContent = currentLabel;

      const menuContainer = document.getElementById('menu-items-container');
      menuContainer.innerHTML = extraKeys.map((key) => {
        const active = state.page === key;
        return `
          <button onclick="navigateTo('${key}')" class="w-full flex items-center justify-between rounded-xl px-3.5 py-2.5 text-start text-sm font-semibold transition ${
            active
              ? 'bg-indigo-600 text-white'
              : 'text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800'
          }">
            <span>${t().extra12[key]}</span>
            <span class="text-xs opacity-60">›</span>
          </button>
        `;
      }).join('');

      const bottomNav = document.getElementById('bottom-nav');
      const mainKeys = ['dashboard', 'transactions', 'invoices', 'calculator', 'assistant'];
      bottomNav.innerHTML = mainKeys.map((key) => {
        const active = state.page === key;
        return `
          <button onclick="navigateTo('${key}')" class="flex flex-col items-center gap-1 rounded-xl px-2 py-1 text-[11px] font-bold transition ${
            active ? 'text-indigo-600 dark:text-indigo-400' : 'text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200'
          }">
            <span class="h-1.5 w-1.5 rounded-full ${active ? 'bg-indigo-600 dark:bg-indigo-400' : 'bg-transparent'}"></span>
            <span class="truncate max-w-[74px]">${t().main5[key]}</span>
          </button>
        `;
      }).join('');
    }

    function renderHomeCoreButtons() {
      const mainKeys = ['dashboard', 'transactions', 'invoices', 'calculator', 'assistant'];
      return `
        <section class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 shadow-sm">
          <div class="mb-4">
            <h2 class="text-lg font-extrabold">${t().homeTitle}</h2>
            <p class="text-xs text-slate-500 dark:text-slate-400">${t().homeSub}</p>
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">
            ${mainKeys.map((key) => {
              const isCurrent = state.page === key;
              return `
                <button onclick="navigateTo('${key}')" class="flex flex-col items-center justify-center gap-2 rounded-2xl border p-4 text-center font-bold text-sm transition ${
                  isCurrent
                    ? 'border-indigo-600 bg-indigo-600 text-white shadow-md'
                    : 'border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/70 text-slate-800 dark:text-slate-100 hover:border-indigo-400'
                }">
                  <span class="flex h-10 w-10 items-center justify-center rounded-xl ${isCurrent ? 'bg-white/20' : 'bg-indigo-100 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-400'} text-base font-extrabold">
                    ${t().main5[key].charAt(0)}
                  </span>
                  <span>${t().main5[key]}</span>
                </button>
              `;
            }).join('')}
          </div>
        </section>
      `;
    }

    function renderPage() {
      const container = document.getElementById('page-container');
      const coreBlock = renderHomeCoreButtons();
      let viewBlock = '';

      const totalUSD = state.transactions.reduce((acc, item) => acc + item.amountUSD, 0);
      const compliantCount = state.transactions.filter(item => item.compliant && item.tax === state.vatRate).length;

      switch (state.page) {
        case 'dashboard':
          viewBlock = `
            <section class="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5">
                <p class="text-xs text-slate-500">${t().main5.transactions}</p>
                <p class="mt-2 text-2xl font-extrabold">${t().money(totalUSD)}</p>
              </div>
              <div class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5">
                <p class="text-xs text-slate-500">${t().extra12.compliance}</p>
                <p class="mt-2 text-2xl font-extrabold text-emerald-600">${compliantCount} / ${state.transactions.length}</p>
              </div>
              <div class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5">
                <p class="text-xs text-slate-500">${t().main5.invoices}</p>
                <p class="mt-2 text-2xl font-extrabold text-indigo-600">${state.invoices.length}</p>
              </div>
            </section>
          `;
          break;

        case 'transactions':
          viewBlock = `
            <section class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 space-y-4">
              <h3 class="text-base font-bold">${t().main5.transactions}</h3>
              <form onsubmit="addTx(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <input id="tx-title" type="text" required placeholder="${t().main5.transactions}" class="rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2 text-sm" />
                <input id="tx-amount" type="number" step="0.01" required placeholder="1000" class="rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2 text-sm" />
                <button type="submit" class="rounded-xl bg-indigo-600 px-4 py-2 text-sm font-bold text-white hover:bg-indigo-700">+</button>
              </form>
              <div class="divide-y divide-slate-100 dark:divide-slate-800">
                ${state.transactions.map(tx => `
                  <div class="flex items-center justify-between py-3 text-sm">
                    <div>
                      <p class="font-bold">${tx.title}</p>
                      <p class="text-xs text-slate-500">VAT: ${tx.tax}%</p>
                    </div>
                    <span class="font-mono font-bold">${t().money(tx.amountUSD)}</span>
                  </div>
                `).join('')}
              </div>
            </section>
          `;
          break;

        case 'invoices':
          viewBlock = `
            <section class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 space-y-3">
              <h3 class="text-base font-bold">${t().main5.invoices}</h3>
              ${state.invoices.map(inv => `
                <div class="flex items-center justify-between rounded-xl border border-slate-200 dark:border-slate-800 p-3.5 text-sm">
                  <div>
                    <p class="font-bold">${inv.id} — ${inv.client}</p>
                    <p class="text-xs text-slate-500">${inv.status}</p>
                  </div>
                  <span class="font-mono font-bold text-indigo-600">${t().money(inv.amountUSD)}</span>
                </div>
              `).join('')}
            </section>
          `;
          break;

        case 'calculator':
          viewBlock = `
            <section class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 space-y-4">
              <h3 class="text-base font-bold">${t().main5.calculator}</h3>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <input id="calc-base" type="number" value="1000" oninput="calcTaxNow()" class="rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2 text-sm" />
                <input id="calc-rate" type="number" value="${state.vatRate}" oninput="calcTaxNow()" class="rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2 text-sm" />
              </div>
              <p id="calc-result" class="text-lg font-extrabold text-indigo-600">${t().money(1000 * (state.vatRate / 100))}</p>
            </section>
          `;
          break;

        case 'assistant':
          viewBlock = `
            <section class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 space-y-3">
              <h3 class="text-base font-bold">${t().main5.assistant}</h3>
              <p class="text-sm text-slate-600 dark:text-slate-300">TaxGuard AI monitors transactions against active tax rules (${state.vatRate}% VAT) and flags non-compliant entries immediately.</p>
            </section>
          `;
          break;

        case 'compliance':
          viewBlock = `
            <section class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 space-y-3">
              <h3 class="text-base font-bold">${t().extra12.compliance}</h3>
              ${state.transactions.map(tx => {
                const ok = tx.compliant && tx.tax === state.vatRate;
                return `
                  <div class="flex items-center justify-between rounded-xl border border-slate-200 dark:border-slate-800 p-3 text-sm">
                    <span>${tx.title} (${tx.tax}%)</span>
                    <span class="rounded-full px-2.5 py-0.5 text-xs font-bold ${ok ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">${ok ? 'OK' : 'Alert'}</span>
                  </div>
                `;
              }).join('')}
            </section>
          `;
          break;

        case 'language':
          viewBlock = `
            <section class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 space-y-3">
              <h3 class="text-base font-bold">${t().extra12.language}</h3>
              <div class="flex flex-wrap gap-2">
                <button onclick="setLanguage('ar')" class="rounded-xl px-4 py-2 text-sm font-bold ${state.lang === 'ar' ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-slate-800'}">العربية</button>
                <button onclick="setLanguage('en')" class="rounded-xl px-4 py-2 text-sm font-bold ${state.lang === 'en' ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-slate-800'}">English</button>
                <button onclick="setLanguage('fr')" class="rounded-xl px-4 py-2 text-sm font-bold ${state.lang === 'fr' ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-slate-800'}">Français</button>
              </div>
            </section>
          `;
          break;

        case 'currency':
          viewBlock = `
            <section class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 space-y-3">
              <h3 class="text-base font-bold">${t().extra12.currency}</h3>
              <div class="flex flex-wrap gap-2">
                ${Object.keys(rates).map(c => `
                  <button onclick="setCurrency('${c}')" class="rounded-xl px-4 py-2 text-sm font-bold ${state.currency === c ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-slate-800'}">${c}</button>
                `).join('')}
              </div>
            </section>
          `;
          break;

        case 'theme':
          viewBlock = `
            <section class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 flex items-center justify-between">
              <h3 class="text-base font-bold">${t().extra12.theme}</h3>
              <button onclick="toggleTheme()" class="rounded-xl bg-indigo-600 px-4 py-2 text-sm font-bold text-white">${state.dark ? 'Light' : 'Dark'}</button>
            </section>
          `;
          break;

        case 'history':
          viewBlock = `
            <section class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 space-y-2">
              <h3 class="text-base font-bold">${t().extra12.history}</h3>
              <ul class="list-disc ps-5 space-y-1 text-sm text-slate-600 dark:text-slate-300">
                ${state.activities.map(act => `<li>${act}</li>`).join('')}
              </ul>
            </section>
          `;
          break;

        default:
          viewBlock = `
            <section class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 space-y-2">
              <h3 class="text-base font-bold">${t().extra12[state.page] || state.page}</h3>
              <p class="text-sm text-slate-600 dark:text-slate-300">TaxGuard AI — Tax Compliance Monitoring Module.</p>
            </section>
          `;
      }

      container.innerHTML = coreBlock + viewBlock;
    }

    function addTx(e) {
      e.preventDefault();
      const title = document.getElementById('tx-title').value;
      const amountUSD = parseFloat(document.getElementById('tx-amount').value);
      state.transactions.unshift({
        id: Date.now(),
        title,
        amountUSD,
        tax: state.vatRate,
        category: 'operational',
        compliant: true
      });
      renderPage();
    }

    function calcTaxNow() {
      const base = parseFloat(document.getElementById('calc-base').value) || 0;
      const rate = parseFloat(document.getElementById('calc-rate').value) || 0;
      document.getElementById('calc-result').textContent = t().money(base * (rate / 100));
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderChrome();
      renderPage();
      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        const app = document.getElementById('app-root');
        splash.style.opacity = '0';
        setTimeout(() => {
          splash.classList.add('hidden');
          app.classList.remove('hidden');
        }, 450);
      }, 2000);
    });
  </script>
</body>
</html>
