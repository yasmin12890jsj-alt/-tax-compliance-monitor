      const credit = Math.max(0, Number(acc.credit) || 0);
      const netBalance = round2(debit - credit);
      const absBalance = Math.abs(netBalance);
      const vatEst = round2((absBalance * (Number(acc.vatRate) || 0)) / 100);

      let risk = 'low';
      let riskAmount = 0;
      let conclusion = 'رصيد متوازن ومتوافق مع القواعد المحاسبية والجبائية.';

      if (!acc.hasInvoice) {
        risk = 'high';
        riskAmount = absBalance;
        conclusion = 'استنتاج: غياب الفاتورة النظامية يعرّض الرصيد لرفض الخصم الضريبي أثناء الرقابة.';
      } else if (!acc.deductible) {
        risk = 'high';
        riskAmount = absBalance;
        conclusion = 'استنتاج: حساب غير قابل للخصم أو يتطلب معالجة ضريبية خاصة؛ يُستبعد من وعاء الخصم.';
      } else if (acc.cash && Math.max(debit, credit) > CASH_CEILING_DZD) {
        risk = 'medium';
        riskAmount = Math.max(debit, credit) - CASH_CEILING_DZD;
        conclusion = 'استنتاج: حركة نقدية تفوق سقف الدفع النقدي؛ يُنصح بتوثيقها وتفضيل التحويل البنكي.';
      } else {
        conclusion = netBalance >= 0
          ? 'استنتاج: رصيد مدين منتظم يدعم الوضعية التشغيلية أو الضريبية.'
          : 'استنتاج: رصيد دائن منتظم يعكس التزاماً أو إيراداً مصرحاً به.';
      }

      return { debit, credit, netBalance, absBalance, vatEst, risk, riskAmount, conclusion };
    }

    function getGlobalAnalytics() {
      let totalDebit = 0;
      let totalCredit = 0;
      let totalRiskAmount = 0;
      let highRiskCount = 0;
      let mediumRiskCount = 0;
      let lowRiskCount = 0;

      const byGroup = {};

      state.accounts.forEach((acc) => {
        const a = analyzeAccount(acc);
        totalDebit = round2(totalDebit + a.debit);
        totalCredit = round2(totalCredit + a.credit);
        totalRiskAmount = round2(totalRiskAmount + a.riskAmount);
        if (a.risk === 'high') highRiskCount++;
        else if (a.risk === 'medium') mediumRiskCount++;
        else lowRiskCount++;

        if (!byGroup[acc.group]) {
          byGroup[acc.group] = { group: acc.group, count: 0, debit: 0, credit: 0, riskAmount: 0 };
        }
        byGroup[acc.group].count++;
        byGroup[acc.group].debit = round2(byGroup[acc.group].debit + a.debit);
        byGroup[acc.group].credit = round2(byGroup[acc.group].credit + a.credit);
        byGroup[acc.group].riskAmount = round2(byGroup[acc.group].riskAmount + a.riskAmount);
      });

      const total = state.accounts.length || 1;
      const complianceIndex = Math.round((lowRiskCount / total) * 100);
      const balanceDiff = round2(totalDebit - totalCredit);

      return {
        totalDebit,
        totalCredit,
        balanceDiff,
        totalRiskAmount,
        highRiskCount,
        mediumRiskCount,
        lowRiskCount,
        complianceIndex,
        groupList: Object.values(byGroup)
      };
    }

    function triggerDownload(filename, content, mime) {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      logActivity(`تنزيل ملف: ${filename}`);
      renderPage();
    }

      state.accounts.forEach((acc) => {

    function importJSON(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(String(reader.result));
          if (Array.isArray(data) && data.length) {
            state.accounts = data;
            persistAccounts();
            logActivity(`استيراد ملف JSON: ${file.name}`);
            renderPage();
          }
        } catch (_) {}
      };
      reader.readAsText(file);
    }

            <h2 class="text-lg font-extrabold">صفحة المساعد الذكي للاستنتاجات والتحليلات</h2>
            <div class="flex flex-wrap gap-2">
              <button type="button" onclick="askAssistant('تحليل الحسابات المعرضة للخطر')" class="rounded-xl bg-slate-100 dark:bg-slate-800 px-3 py-1.5 text-xs font-bold">استنتاجات المخاطر</button>
              <button type="button" onclick="askAssistant('ملخص الامتثال الكلي')" class="rounded-xl bg-slate-100 dark:bg-slate-800 px-3 py-1.5 text-xs font-bold">ملخص الامتثال</button>
            </div>
            <div class="flex gap-2">
              <input id="ai-input" type="text" value="${state.aiQuestion}" placeholder="اسألي المساعد عن أي حساب أو استنتاج..." class="flex-1 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3.5 py-2 text-sm" />
              <button type="button" onclick="askAssistant()" class="rounded-xl bg-indigo-600 px-5 py-2 text-sm font-extrabold text-white hover:bg-indigo-700">تحليل</button>
            </div>
            <div class="rounded-xl border border-indigo-200 dark:border-indigo-800 bg-indigo-50/60 dark:bg-indigo-950/30 p-4 text-xs sm:text-sm whitespace-pre-line leading-relaxed">${state.aiReply}</div>
          </section>
        `;
        return;
      }

      if (state.page === 'files') {
        container.innerHTML = `
          <section class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 shadow-sm space-y-4">
            <h2 class="text-lg font-extrabold">صفحة حفظ الملفات وتنزيل الجداول والتحليلات</h2>
            <div class="flex flex-wrap gap-2.5">
              <button type="button" onclick="exportAccountsCSV()" class="rounded-xl bg-indigo-600 px-4 py-2.5 text-xs font-extrabold text-white hover:bg-indigo-700">تنزيل CSV</button>
              <button type="button" onclick="exportAnalysisTXT()" class="rounded-xl bg-cyan-600 px-4 py-2.5 text-xs font-extrabold text-white hover:bg-cyan-700">تنزيل الاستنتاجات (TXT)</button>
              <button type="button" onclick="exportJSON()" class="rounded-xl border border-indigo-600 px-4 py-2.5 text-xs font-extrabold text-indigo-600 dark:text-indigo-300">تنزيل نسخة JSON</button>
            </div>
            <div>
              <label class="block text-xs font-bold mb-1">استعادة ملف JSON</label>
              <input type="file" accept="application/json,.json" onchange="importJSON(event)" class="block w-full text-xs text-slate-500 file:me-3 file:rounded-xl file:border-0 file:bg-slate-100 dark:file:bg-slate-800 file:px-3.5 file:py-2 file:text-xs file:font-bold" />
            </div>
          </section>
        `;
        return;
      }

      if (state.page === 'compliance') {
        container.innerHTML = `
          <section class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 shadow-sm space-y-4">
            <h2 class="text-lg font-extrabold">صفحة فحص الامتثال والمخالفات</h2>
            ${renderAccountsAnalyticalTable(state.accounts.filter((a) => analyzeAccount(a).risk !== 'low'))}
          </section>
        `;
        return;
      }

      if (state.page === 'reports') {
        container.innerHTML = `
          <section class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 shadow-sm space-y-4">
            <h2 class="text-lg font-extrabold">صفحة التقارير والاستنتاجات التحليلية</h2>
            ${renderGroupSummaryTable(g.groupList)}
          </section>
        `;
        return;
      }

      if (state.page === 'regulations') {
        container.innerHTML = `
          <section class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 shadow-sm space-y-2">
            <h2 class="text-lg font-extrabold">صفحة اللوائح وقواعد التحليل</h2>
            <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-300">يتم تقييم الحسابات وفق توفر الفاتورة، القابلية للخصم، مراقبة الحركات النقدية، وتحليل الأرصدة المدينة والدائنة.</p>
          </section>
        `;
        return;
      }

      if (state.page === 'deadlines') {
        container.innerHTML = `
          <section class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 shadow-sm space-y-2">
            <h2 class="text-lg font-extrabold">صفحة المواعيد الضريبية</h2>
            <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-300">مراجعة الحسابات الـ 18 وتصفية الاستنتاجات ذات المخاطر قبل موعد التصريح.</p>
          </section>
        `;
        return;
      }

      if (state.page === 'history') {
        container.innerHTML = `
          <section class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 shadow-sm space-y-2">
            <h2 class="text-lg font-extrabold">صفحة السجل</h2>
            <ul class="list-disc ps-5 text-xs sm:text-sm space-y-1 text-slate-700 dark:text-slate-300">
              ${state.activities.map((a) => `<li>${a}</li>`).join('')}
            </ul>
          </section>
        `;
        return;
      }

      container.innerHTML = `
        <section class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 shadow-sm space-y-4">
          <h2 class="text-lg font-extrabold">صفحة الإعدادات</h2>
          <button type="button" onclick="resetAccounts()" class="rounded-xl border border-rose-500 px-4 py-2 text-xs font-extrabold text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/30">استعادة الحسابات الـ 18 الافتراضية</button>
        </section>
      `;
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderChrome();
      renderPage();
      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        const app = document.getElementById('app-root');
        splash.style.opacity = '0';
        setTimeout(() => {
          splash.classList.add('hidden');
          app.classList.remove('hidden');
        }, 450);
      }, 2000);
    });
  </script>
</body>
</html>
