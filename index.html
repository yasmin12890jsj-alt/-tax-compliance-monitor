<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaxGuard AI — Tax Compliance Monitoring</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca'
            }
          }
        }
      }
    };
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Cairo', 'Inter', sans-serif;
    }
    @keyframes pulseShield {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 12px rgba(99, 102, 241, 0.55)); }
      50% { transform: scale(1.07); filter: drop-shadow(0 0 24px rgba(34, 211, 238, 0.75)); }
    }
    @keyframes loadBar {
      0% { width: 0%; }
      100% { width: 100%; }
    }
    .shield-anim { animation: pulseShield 1.8s infinite ease-in-out; }
    .progress-anim { animation: loadBar 2s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300">

  <!-- Animated Splash Screen -->
  <div id="splash-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-950 text-white transition-opacity duration-500">
    <div class="shield-anim mb-5 flex h-24 w-24 items-center justify-center rounded-3xl bg-gradient-to-tr from-indigo-600 to-cyan-500 shadow-2xl">
      <svg class="h-14 w-14 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
      </svg>
    </div>
    <h1 class="text-3xl font-extrabold bg-gradient-to-r from-indigo-400 to-cyan-300 bg-clip-text text-transparent">TaxGuard AI</h1>
    <p class="mt-2 text-xs text-slate-400">Tax Compliance Monitoring</p>
    <div class="mt-7 h-1.5 w-52 overflow-hidden rounded-full bg-slate-800">
      <div class="progress-anim h-full rounded-full bg-gradient-to-r from-indigo-500 to-cyan-400"></div>
    </div>
  </div>

  <!-- Main App -->
  <div id="app-root" class="hidden min-h-screen flex flex-col pb-20 md:pb-8">

    <!-- Top Header -->
    <header class="sticky top-0 z-30 border-b border-slate-200 dark:border-slate-800 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md">
      <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3.5 sm:px-6">
        <button onclick="navigateTo('dashboard')" class="flex items-center gap-3 text-start">
          <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-indigo-600 text-white shadow">
            <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
            </svg>
          </div>
          <div>
            <span class="text-base font-extrabold text-slate-900 dark:text-white">TaxGuard AI</span>
            <p id="header-page-title" class="text-xs text-slate-500 dark:text-slate-400">لوحة القيادة</p>
          </div>
        </button>

        <!-- Three-Dot Menu Button (⋮) -->
        <div class="relative">
          <button id="menu-btn" onclick="toggleMenu(event)" aria-label="Menu" class="flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700 transition">
            <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24">
              <circle cx="12" cy="5" r="2" />
              <circle cx="12" cy="12" r="2" />
              <circle cx="12" cy="19" r="2" />
            </svg>
          </button>

          <!-- Dropdown / Drawer Menu -->
          <div id="more-menu" class="invisible opacity-0 scale-95 pointer-events-none fixed md:absolute inset-x-4 md:inset-x-auto top-16 md:top-12 end-auto md:end-0 z-50 w-auto md:w-72 max-h-[80vh] overflow-y-auto rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-2 shadow-2xl transition-all duration-200 origin-top-end">
            <div id="menu-items-container" class="space-y-1"></div>
          </div>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <main id="page-container" class="mx-auto w-full max-w-6xl flex-1 px-4 py-6 sm:px-6 space-y-6"></main>

    <!-- Bottom Navigation Bar -->

    </nav>

      en: {

    const extraKeys = [
      'compliance', 'regulations', 'deadlines', 'reports',
      'notifications', 'currency', 'history', 'language',
      'theme', 'settings', 'help', 'about'
    ];

    function t() {
      return dict[state.lang];
    }

    function logActivity(text) {
      state.activities.unshift(text);
      if (state.activities.length > 20) state.activities.pop();
    }

    function evaluateCompliance(type, rate) {
      if (type === 'personal') return { ok: false, label: state.lang === 'ar' ? 'مخالف (شخصي)' : 'Non-Compliant' };
      if (type === 'export' && rate > 0) return { ok: false, label: state.lang === 'ar' ? 'تنبيه (تصدير بضريبة)' : 'Review (Export > 0%)' };
      if ((type === 'sales' || type === 'operational') && rate !== 19 && rate !== 9) {
        return { ok: false, label: state.lang === 'ar' ? 'مراجعة (نسبة غير قياسية)' : 'Review (VAT Rate)' };
      }
      return { ok: true, label: state.lang === 'ar' ? 'متوافق' : 'Compliant' };
    }

    function toggleMenu(e) {
      if (e) e.stopPropagation();
      state.menuOpen = !state.menuOpen;
      renderMenuVisibility();
    }

    function closeMenu() {
      if (!state.menuOpen) return;
      state.menuOpen = false;
      renderMenuVisibility();
    }

    function renderMenuVisibility() {
      const menu = document.getElementById('more-menu');
      if (state.menuOpen) {
        menu.classList.remove('invisible', 'opacity-0', 'scale-95', 'pointer-events-none');
        menu.classList.add('visible', 'opacity-100', 'scale-100', 'pointer-events-auto');
      } else {
        menu.classList.add('invisible', 'opacity-0', 'scale-95', 'pointer-events-none');
        menu.classList.remove('visible', 'opacity-100', 'scale-100', 'pointer-events-auto');
      }
    }

    document.addEventListener('click', (e) => {
      const menu = document.getElementById('more-menu');
      const btn = document.getElementById('menu-btn');
      if (state.menuOpen && !menu.contains(e.target) && !btn.contains(e.target)) {
        closeMenu();
      }
    });

    function navigateTo(pageKey) {
      state.page = pageKey;
      closeMenu();
      logActivity(t().main5[pageKey] || t().extra12[pageKey] || pageKey);
      renderChrome();
      renderPage();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setLanguage(lang) {
      state.lang = lang;
      document.documentElement.lang = lang;
      document.documentElement.dir = t().dir;
      renderChrome();
      renderPage();
    }

    function setCurrency(curr) {
      state.currency = curr;
      renderPage();
    }

    function toggleTheme() {
      state.dark = !state.dark;
      document.documentElement.classList.toggle('dark', state.dark);
      renderPage();
    }

    function renderChrome() {
      const currentLabel = t().main5[state.page] || t().extra12[state.page] || t().homeTitle;
      document.getElementById('header-page-title').textContent = currentLabel;

      const menuContainer = document.getElementById('menu-items-container');
      menuContainer.innerHTML = extraKeys.map((key) => {
        const active = state.page === key;
        return `
          <button onclick="navigateTo('${key}')" class="w-full flex items-center justify-between rounded-xl px-3.5 py-2.5 text-start text-sm font-semibold transition ${
            active
              ? 'bg-indigo-600 text-white'
              : 'text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800'
          }">
            <span class="flex items-center gap-2.5">
              ${icons[key]}
              <span>${t().extra12[key]}</span>
            </span>
            <span class="text-xs opacity-60">›</span>
          </button>
        `;
      }).join('');

      const bottomNav = document.getElementById('bottom-nav');
      const mainKeys = ['dashboard', 'transactions', 'invoices', 'calculator', 'assistant'];
      bottomNav.innerHTML = mainKeys.map((key) => {
        const active = state.page === key;
        return `
          <button onclick="navigateTo('${key}')" class="flex flex-col items-center gap-1 rounded-xl px-2 py-1 text-[11px] font-bold transition ${
            active ? 'text-indigo-600 dark:text-indigo-400' : 'text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200'
          }">
            ${icons[key]}
            <span class="truncate max-w-[76px]">${t().main5[key]}</span>
          </button>
        `;
      }).join('');
    }

    function renderHomeCoreButtons() {
      const mainKeys = ['dashboard', 'transactions', 'invoices', 'calculator', 'assistant'];
      return `
        <section class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 shadow-sm">
          <div class="mb-4">
            <h2 class="text-lg font-extrabold">${t().homeTitle}</h2>
            <p class="text-xs text-slate-500 dark:text-slate-400">${t().homeSub}</p>
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">
            ${mainKeys.map((key) => {
              const isCurrent = state.page === key;
              return `
                <button onclick="navigateTo('${key}')" class="flex flex-col items-center justify-center gap-2 rounded-2xl border p-4 text-center font-bold text-sm transition ${
                  isCurrent
                    ? 'border-indigo-600 bg-indigo-600 text-white shadow-md'
                    : 'border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/70 text-slate-800 dark:text-slate-100 hover:border-indigo-400'
                }">
                  <span class="flex h-11 w-11 items-center justify-center rounded-xl ${isCurrent ? 'bg-white/20 text-white' : 'bg-indigo-100 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-400'}">
                    ${icons[key]}
                  </span>
                  <span>${t().main5[key]}</span>
                </button>
              `;
            }).join('')}
          </div>
        </section>
      `;
    }

    function renderTransactionFormAndTable() {
      const previewHtml = state.previewCalc ? `
        <div class="mt-4 rounded-xl border border-indigo-200 dark:border-indigo-800 bg-indigo-50/70 dark:bg-indigo-950/40 p-4 flex flex-wrap items-center justify-between gap-4 text-sm">
          <div>
            <span class="text-xs text-slate-500 dark:text-slate-400">${t().taxVal}:</span>
            <p class="font-mono font-extrabold text-indigo-600 dark:text-indigo-400">${t().money(state.previewCalc.taxAmount)}</p>
          </div>
          <div>
            <span class="text-xs text-slate-500 dark:text-slate-400">${t().totalVal}:</span>
            <p class="font-mono font-extrabold text-slate-900 dark:text-white">${t().money(state.previewCalc.totalAmount)}</p>
          </div>
          <div>
            <span class="text-xs text-slate-500 dark:text-slate-400">${t().complianceStatus}:</span>
            <p class="font-bold ${state.previewCalc.comp.ok ? 'text-emerald-600' : 'text-rose-600'}">${state.previewCalc.comp.label}</p>
          </div>
        </div>
      ` : '';

      const rowsHtml = state.transactions.map((tx) => {
        const comp = evaluateCompliance(tx.type, tx.rate);
        return `
          <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/40">
            <td class="py-3 px-2 font-bold">${tx.name}</td>
            <td class="py-3 px-2 font-mono text-xs">${tx.invoice}</td>
            <td class="py-3 px-2 text-xs">${t().types[tx.type] || tx.type}</td>
            <td class="py-3 px-2 font-mono">${t().money(tx.beforeTax)}</td>
            <td class="py-3 px-2 font-mono">${tx.rate}%</td>
            <td class="py-3 px-2 font-mono text-indigo-600 dark:text-indigo-400">${t().money(tx.taxAmount)}</td>
            <td class="py-3 px-2 font-mono font-bold">${t().money(tx.totalAmount)}</td>
            <td class="py-3 px-2">
              <span class="rounded-full px-2.5 py-1 text-xs font-bold ${comp.ok ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300' : 'bg-rose-100 text-rose-700 dark:bg-rose-900/40 dark:text-rose-300'}">${comp.label}</span>
            </td>
            <td class="py-3 px-2">
              <button onclick="deleteTx(${tx.id})" class="rounded-lg bg-rose-50 dark:bg-rose-950/50 px-2.5 py-1 text-xs font-bold text-rose-600 hover:bg-rose-100">×</button>
            </td>
          </tr>
        `;
      }).join('');

      return `
        <section class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 shadow-sm">
          <form onsubmit="handleSaveTx(event)" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            <div>
              <label class="block text-xs font-bold mb-1">${t().txName}</label>
              <input id="f-name" type="text" required placeholder="مثال: شراء معدات" class="w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3.5 py-2 text-sm focus:border-indigo-500 focus:outline-none" />
            </div>
            <div>
              <label class="block text-xs font-bold mb-1">${t().invNum}</label>
              <input id="f-invoice" type="text" required placeholder="INV-2026-003" class="w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3.5 py-2 text-sm focus:border-indigo-500 focus:outline-none" />
            </div>
            <div>
              <label class="block text-xs font-bold mb-1">${t().txType}</label>
              <select id="f-type" class="w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3.5 py-2 text-sm focus:border-indigo-500 focus:outline-none">
                <option value="operational">${t().types.operational}</option>
                <option value="sales">${t().types.sales}</option>
                <option value="export">${t().types.export}</option>
                <option value="personal">${t().types.personal}</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-bold mb-1">${t().beforeTax}</label>
              <input id="f-before-tax" type="number" step="0.01" required placeholder="10000" class="w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3.5 py-2 text-sm focus:border-indigo-500 focus:outline-none" />
            </div>
            <div>
              <label class="block text-xs font-bold mb-1">${t().taxRate}</label>
              <input id="f-tax-rate" type="number" step="0.1" required placeholder="19" class="w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3.5 py-2 text-sm focus:border-indigo-500 focus:outline-none" />
            </div>
            <div class="flex items-end gap-2.5">
              <button type="button" onclick="handleCalculate()" class="flex-1 rounded-xl border border-indigo-600 bg-indigo-50 dark:bg-indigo-950/40 px-4 py-2 text-sm font-extrabold text-indigo-600 dark:text-indigo-400 hover:bg-indigo-100 transition">
                ${t().calcBtn}
              </button>
              <button type="submit" class="flex-1 rounded-xl bg-indigo-600 px-4 py-2 text-sm font-extrabold text-white shadow hover:bg-indigo-700 transition">
                ${t().saveBtn}
              </button>
            </div>
          </form>
          ${previewHtml}
        </section>

        <section class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 shadow-sm">
          <h3 class="text-base font-extrabold mb-4">${t().resultsTableTitle}</h3>
          <div class="overflow-x-auto">
            <table class="w-full text-start text-sm">
              <thead>
                <tr class="border-b border-slate-200 dark:border-slate-800 text-xs text-slate-500 dark:text-slate-400">
                  <th class="pb-3 px-2 text-start">${t().txName}</th>
                  <th class="pb-3 px-2 text-start">${t().invNum}</th>
                  <th class="pb-3 px-2 text-start">${t().txType}</th>
                  <th class="pb-3 px-2 text-start">${t().beforeTax}</th>
                  <th class="pb-3 px-2 text-start">${t().taxRate}</th>
                  <th class="pb-3 px-2 text-start">${t().taxVal}</th>
                  <th class="pb-3 px-2 text-start">${t().totalVal}</th>
                  <th class="pb-3 px-2 text-start">${t().complianceStatus}</th>
                  <th class="pb-3 px-2 text-start"></th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100 dark:divide-slate-800">${rowsHtml}</tbody>
            </table>
          </div>
        </section>
      `;
    }

    function readFormValues() {
      const name = (document.getElementById('f-name')?.value || '').trim() || 'معاملة جديدة';
      const invoice = (document.getElementById('f-invoice')?.value || '').trim() || `INV-${Date.now().toString().slice(-4)}`;
      const type = document.getElementById('f-type')?.value || 'operational';
      const beforeTax = parseFloat(document.getElementById('f-before-tax')?.value) || 0;
      const rate = parseFloat(document.getElementById('f-tax-rate')?.value) || 0;
      const taxAmount = +(beforeTax * (rate / 100)).toFixed(2);
      const totalAmount = +(beforeTax + taxAmount).toFixed(2);
      const comp = evaluateCompliance(type, rate);
      return { name, invoice, type, beforeTax, rate, taxAmount, totalAmount, comp };
    }

    function handleCalculate() {
      const vals = readFormValues();
      state.previewCalc = vals;
      logActivity(`${t().calcBtn}: ${vals.name}`);
      renderPage();
    }

    function handleSaveTx(e) {
      e.preventDefault();
      const vals = readFormValues();
      state.transactions.unshift({
        id: Date.now(),
        name: vals.name,
        invoice: vals.invoice,
        beforeTax: vals.beforeTax,
        rate: vals.rate,
        type: vals.type,
        taxAmount: vals.taxAmount,
        totalAmount: vals.totalAmount
      });
      state.previewCalc = vals;
      logActivity(`${t().saveBtn}: ${vals.name} (${vals.invoice})`);
      renderPage();
    }

    function deleteTx(id) {
      state.transactions = state.transactions.filter(item => item.id !== id);
      renderPage();
    }

    function renderPage() {
      const container = document.getElementById('page-container');
      const coreBlock = renderHomeCoreButtons();
      let extraBlock = '';

      if (state.page === 'language') {
        extraBlock = `
          <section class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 space-y-3">
            <h3 class="text-base font-bold">${t().extra12.language}</h3>
            <div class="flex flex-wrap gap-2">
              <button onclick="setLanguage('ar')" class="rounded-xl px-4 py-2 text-sm font-bold ${state.lang === 'ar' ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-slate-800'}">العربية</button>
              <button onclick="setLanguage('en')" class="rounded-xl px-4 py-2 text-sm font-bold ${state.lang === 'en' ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-slate-800'}">English</button>
              <button onclick="setLanguage('fr')" class="rounded-xl px-4 py-2 text-sm font-bold ${state.lang === 'fr' ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-slate-800'}">Français</button>
            </div>
          </section>
        `;
      } else if (state.page === 'currency') {
        extraBlock = `
          <section class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 space-y-3">
            <h3 class="text-base font-bold">${t().extra12.currency}</h3>
            <div class="flex flex-wrap gap-2">
              ${Object.keys(rates).map(c => `
                <button onclick="setCurrency('${c}')" class="rounded-xl px-4 py-2 text-sm font-bold ${state.currency === c ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-slate-800'}">${c}</button>
              `).join('')}
            </div>
          </section>
        `;
      } else if (state.page === 'theme') {
        extraBlock = `
          <section class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 flex items-center justify-between">
            <h3 class="text-base font-bold">${t().extra12.theme}</h3>
            <button onclick="toggleTheme()" class="rounded-xl bg-indigo-600 px-4 py-2 text-sm font-bold text-white">${state.dark ? 'Light' : 'Dark'}</button>
          </section>
        `;
      } else if (state.page === 'history') {
        extraBlock = `
          <section class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 space-y-2">
            <h3 class="text-base font-bold">${t().extra12.history}</h3>
            <ul class="list-disc ps-5 space-y-1 text-sm text-slate-600 dark:text-slate-300">
              ${state.activities.map(act => `<li>${act}</li>`).join('')}
            </ul>
          </section>
        `;
      } else if (!['dashboard', 'transactions', 'invoices', 'calculator', 'assistant'].includes(state.page)) {
        extraBlock = `
          <section class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 space-y-2">
            <h3 class="text-base font-bold">${t().extra12[state.page] || state.page}</h3>
            <p class="text-sm text-slate-600 dark:text-slate-300">TaxGuard AI — Tax Compliance Monitoring</p>
          </section>
        `;
      }

      container.innerHTML = coreBlock + extraBlock + renderTransactionFormAndTable();
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderChrome();
      renderPage();
      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        const app = document.getElementById('app-root');
        splash.style.opacity = '0';
        setTimeout(() => {
          splash.classList.add('hidden');
          app.classList.remove('hidden');
        }, 450);
      }, 2000);
    });
  </script>
</body>
</html>
