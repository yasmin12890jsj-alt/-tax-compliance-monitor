    body {

    }
    @keyframes pulseShield {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 14px rgba(99, 102, 241, 0.55)); }
      50% { transform: scale(1.07); filter: drop-shadow(0 0 26px rgba(34, 211, 238, 0.75)); }
    }
    @keyframes loadBar {
      0% { width: 0%; }
      100% { width: 100%; }
    }
    .shield-anim { animation: pulseShield 1.8s infinite ease-in-out; }
    .progress-anim { animation: loadBar 2s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>

    function round2(num) {
      return Math.round((Number(num) + Number.EPSILON) * 100) / 100;
    }

    function t() {
      return dict[state.lang];
    }

    function logActivity(text) {
      state.activities.unshift(text);
      if (state.activities.length > 20) state.activities.pop();
    }

    function evaluateAudit(item) {
      const beforeTax = Math.max(0, Number(item.beforeTax) || 0);
      const rate = Math.max(0, Number(item.rate) || 0);
      const taxAmount = round2((beforeTax * rate) / 100);
      const totalAmount = round2(beforeTax + taxAmount);

      let risk = 'low';
      let atRiskAmount = 0;
      let finding = '';

      if (!item.hasInvoice) {
        risk = 'high';
        atRiskAmount = totalAmount;
        finding = state.lang === 'ar'
          ? 'خطر استبعاد: غياب الفاتورة الرسمية يعرّض العملية لرفض الاعتراف الضريبي. أرفق فاتورة مستوفاة.'
          : 'Disallowal risk: missing official invoice can invalidate deduction. Attach complete invoice.';
      } else if (item.type === 'personal') {
        risk = 'high';
        atRiskAmount = totalAmount;
        finding = state.lang === 'ar'
          ? 'مخالفة عدم القابلية للخصم: المصاريف الشخصية تُستبعد من الخصم الضريبي. افصلها عن حسابات النشاط.'
          : 'Non-deductible expense: personal items must be excluded from business deductions.';
      } else if (item.payment === 'cash' && totalAmount > CASH_CEILING_DZD) {
        risk = 'high';
        atRiskAmount = totalAmount;
        finding = state.lang === 'ar'
          ? 'تجاوز سقف الدفع النقدي: المبلغ النقدي يفوق العتبة المحددة. يُنصح بالاعتماد على التحويل البنكي.'
          : 'Cash limit breach: cash payment exceeds threshold. Use bank transfer where required.';
      } else if (item.type === 'export' && rate > 0) {
        risk = 'medium';
        atRiskAmount = taxAmount;
        finding = state.lang === 'ar'
          ? 'تنبيه نسبة التصدير: التصدير غالباً معفى (0%). تحقق من أهلية الإعفاء قبل التصريح.'
          : 'Export rate warning: exports are commonly 0%. Verify exemption criteria before filing.';
      } else if ((item.type === 'sale' || item.type === 'purchase_op') && rate !== 19 && rate !== 9) {
        risk = 'medium';
        atRiskAmount = taxAmount;
        finding = state.lang === 'ar'
          ? 'نسبة ضريبة غير قياسية: النسبة تختلف عن 19% و9%. راجع التصنيف الجبائي للسلعة أو الخدمة.'
          : 'Non-standard rate: rate differs from 19% / 9%. Confirm applicable tax schedule.';
      } else {
        risk = 'low';
        atRiskAmount = 0;
        finding = state.lang === 'ar'
          ? 'متوافق مع قواعد الفحص: البيانات والفاتورة ونوع العملية متسقة.'
          : 'Audit check passed: transaction type, invoice, and rate are consistent.';
      }

      return { beforeTax: round2(beforeTax), rate: round2(rate), taxAmount, totalAmount, atRiskAmount, risk, finding };
    }

      const menu = document.getElementById('more-menu');
      if (state.menuOpen) {
        menu.classList.remove('invisible', 'opacity-0', 'scale-95', 'pointer-events-none');
        menu.classList.add('visible', 'opacity-100', 'scale-100', 'pointer-events-auto');
      } else {
        menu.classList.add('invisible', 'opacity-0', 'scale-95', 'pointer-events-none');
        menu.classList.remove('visible', 'opacity-100', 'scale-100', 'pointer-events-auto');
      }
    }

    document.addEventListener('click', (e) => {
      const menu = document.getElementById('more-menu');
      const btn = document.getElementById('menu-btn');
      if (state.menuOpen && !menu.contains(e.target) && !btn.contains(e.target)) {
        closeMenu();
      }
    });

    function readFormValues() {
      const name = (document.getElementById('f-name')?.value || '').trim() || 'معاملة جديدة';
      const invoice = (document.getElementById('f-invoice')?.value || '').trim() || `INV-${Date.now().toString().slice(-4)}`;
      const type = document.getElementById('f-type')?.value || 'purchase_op';
      const payment = document.getElementById('f-payment')?.value || 'bank';
      const beforeTax = parseFloat(document.getElementById('f-before-tax')?.value) || 0;
      const rate = parseFloat(document.getElementById('f-tax-rate')?.value) || 0;
      const hasInvoice = Boolean(document.getElementById('f-has-invoice')?.checked);

      const raw = { name, invoice, type, payment, beforeTax, rate, hasInvoice };
      const audit = evaluateAudit(raw);
      return { ...raw, audit };
    }

    function handleCalculate() {
      state.lastAudit = readFormValues();
      logActivity(`${t().calcBtn}: ${state.lastAudit.name}`);
      renderPage();

    function handleSaveTransaction(e) {
      e.preventDefault();
      const entry = readFormValues();
      state.records.unshift({
        id: Date.now(),
        name: entry.name,
        invoice: entry.invoice,
        beforeTax: entry.audit.beforeTax,
        rate: entry.audit.rate,
        type: entry.type,
        payment: entry.payment,
        hasInvoice: entry.hasInvoice
      });
      state.lastAudit = entry;
      logActivity(`${t().saveBtn}: ${entry.name} (${entry.invoice})`);
      renderPage();
    }

                  <th class="pb-3 px-2 text-start">${t().txName}</th>
                  <th class="pb-3 px-2 text-start">${t().invNum}</th>
                  <th class="pb-3 px-2 text-start">${t().txType}</th>
                  <th class="pb-3 px-2 text-start">${t().beforeTax}</th>
                  <th class="pb-3 px-2 text-start">${t().taxRate}</th>
                  <th class="pb-3 px-2 text-start">${t().taxVal}</th>
                  <th class="pb-3 px-2 text-start">${t().totalVal}</th>
                  <th class="pb-3 px-2 text-start">${t().riskCol}</th>
                  <th class="pb-3 px-2 text-start">${t().findingCol}</th>
                  <th class="pb-3 px-2 text-start"></th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100 dark:divide-slate-800">${rowsHtml}</tbody>
            </table>
          </div>
        </section>
      `;
    }

    function renderActiveSectionBanner() {
      const detailText = t().sectionDetails?.[state.page];
      if (!detailText) return '';
      return `
        <section class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-4 shadow-sm">
          <div class="flex items-center justify-between gap-2">
            <h3 class="text-sm font-extrabold text-indigo-600 dark:text-indigo-400">${t().labels[state.page] || state.page}</h3>
          </div>
          <p class="mt-1 text-xs text-slate-600 dark:text-slate-300">${detailText}</p>
        </section>
      `;
    }

    function renderPage() {
      const container = document.getElementById('page-container');
      container.innerHTML =
        renderHome5AndAuditCard() +
        renderAuditKPIs() +
        renderActiveSectionBanner() +
        renderFormAndAuditTable();
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderChrome();
      renderPage();
      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        const app = document.getElementById('app-root');
        splash.style.opacity = '0';
        setTimeout(() => {
          splash.classList.add('hidden');
          app.classList.remove('hidden');
        }, 450);
      }, 2000);
    });
  </script>
</body>
</html>
