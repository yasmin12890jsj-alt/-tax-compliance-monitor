  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca'
            }
          }
        }
      }
    };

    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Cairo', 'Inter', sans-serif;
    }
    @keyframes pulseShield {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 14px rgba(99, 102, 241, 0.55)); }
      50% { transform: scale(1.07); filter: drop-shadow(0 0 26px rgba(34, 211, 238, 0.75)); }
    }
    @keyframes loadBar {
      0% { width: 0%; }
      100% { width: 100%; }
    }
    .shield-anim { animation: pulseShield 1.8s infinite ease-in-out; }
    .progress-anim { animation: loadBar 2s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>

    };

    function round2(num) {
      return Math.round((Number(num) + Number.EPSILON) * 100) / 100;
    }

    function t() {
      return dict[state.lang];
    }

    function logActivity(text) {
      state.activities.unshift(text);
      if (state.activities.length > 25) state.activities.pop();
    }

    function evaluateAudit(item) {
      const beforeTax = Math.max(0, Number(item.beforeTax) || 0);
      const rate = Math.max(0, Number(item.rate) || 0);
      const taxAmount = round2((beforeTax * rate) / 100);
      const totalAmount = round2(beforeTax + taxAmount);

      let risk = 'low';
      let atRiskAmount = 0;
      let finding = '';

      if (!item.hasInvoice) {
        risk = 'high';
        atRiskAmount = totalAmount;
        finding = 'خطر استبعاد: غياب الفاتورة الرسمية يعرّض العملية لرفض الاعتراف الضريبي. أرفق فاتورة مستوفاة.';
      } else if (item.type === 'personal') {
        risk = 'high';
        atRiskAmount = totalAmount;
        finding = 'مخالفة عدم القابلية للخصم: المصاريف الشخصية تُستبعد من الخصم الضريبي. افصلها عن حسابات النشاط.';
      } else if (item.payment === 'cash' && totalAmount > CASH_CEILING_DZD) {
        risk = 'high';
        atRiskAmount = totalAmount;
        finding = 'تجاوز سقف الدفع النقدي: المبلغ النقدي يفوق العتبة المحددة. يُنصح بالاعتماد على التحويل البنكي.';
      } else if (item.type === 'export' && rate > 0) {
        risk = 'medium';
        atRiskAmount = taxAmount;
        finding = 'تنبيه نسبة التصدير: التصدير غالباً معفى (0%). تحقق من أهلية الإعفاء قبل التصريح.';
      } else if ((item.type === 'sale' || item.type === 'purchase_op') && rate !== 19 && rate !== 9) {
        risk = 'medium';
        atRiskAmount = taxAmount;
        finding = 'نسبة ضريبة غير قياسية: النسبة تختلف عن 19% و9%. راجع التصنيف الجبائي للسلعة أو الخدمة.';
      } else {
        risk = 'low';
        atRiskAmount = 0;
        finding = 'متوافق مع قواعد الفحص: البيانات والفاتورة ونوع العملية متسقة.';
      }

      return { beforeTax: round2(beforeTax), rate: round2(rate), taxAmount, totalAmount, atRiskAmount, risk, finding };
    }

    function getSummaryStats() {
      let compliantCount = 0;
      let flaggedCount = 0;
      let atRiskSum = 0;
      let totalTax = 0;
      let totalTTC = 0;

      state.records.forEach((rec) => {
        const res = evaluateAudit(rec);
        totalTax = round2(totalTax + res.taxAmount);
        totalTTC = round2(totalTTC + res.totalAmount);
        if (res.risk === 'low') compliantCount++;
        else flaggedCount++;
        atRiskSum = round2(atRiskSum + res.atRiskAmount);
      });

      const total = state.records.length;
      const indexPct = total ? Math.round((compliantCount / total) * 100) : 100;
      return { compliantCount, flaggedCount, atRiskSum, totalTax, totalTTC, indexPct };
    }

    function triggerDownload(filename, content, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      logActivity(`تنزيل ملف: ${filename}`);
      renderPage();
    }

    function downloadCSV() {
      const headers = ['ID', 'Name', 'Invoice', 'Type', 'Payment', 'HasInvoice', 'BeforeTax_DZD', 'Rate_Pct', 'Tax_DZD', 'Total_DZD', 'Risk', 'Finding'];
      const lines = [headers.join(',')];
      state.records.forEach((r) => {
        const a = evaluateAudit(r);
        lines.push([
          r.id,
          `"${String(r.name).replace(/"/g, '""')}"`,
          `"${String(r.invoice).replace(/"/g, '""')}"`,
          r.type,
          r.payment,
          r.hasInvoice,
          a.beforeTax,
          a.rate,
          a.taxAmount,
          a.totalAmount,
          a.risk,
          `"${String(a.finding).replace(/"/g, '""')}"`
        ].join(','));
      });
      triggerDownload('taxguard-audit.csv', '\uFEFF' + lines.join('\n'), 'text/csv;charset=utf-8;');
    }

    function downloadReportTXT() {
      const lines = state.records.map((r, i) => {
        const a = evaluateAudit(r);
        return `${i + 1}. ${r.name} | ${r.invoice} | HT: ${a.beforeTax} | Tax: ${a.taxAmount} | TTC: ${a.totalAmount} | Risk: ${a.risk} | ${a.finding}`;
      });
      triggerDownload('taxguard-report.txt', `TaxGuard AI Audit Report\n\n${lines.join('\n')}`, 'text/plain;charset=utf-8;');
    }

    function downloadJSONBackup() {
      triggerDownload('taxguard-backup.json', JSON.stringify(state.records, null, 2), 'application/json');
    }

    function handleJsonUpload(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const imported = JSON.parse(String(reader.result));
          if (Array.isArray(imported) && imported.length) {
            state.records = imported;
            persistRecords();
            logActivity(`استعادة ملف JSON: ${file.name}`);
            renderPage();
          }
        } catch (_) {}
      };
      reader.readAsText(file);
    }

    function resetSampleRecords() {
      state.records = [...defaultRecords];
      persistRecords();
      logActivity('استعادة البيانات الافتراضية');
      renderPage();
    }

    function askAssistantWithPrompt(presetText) {
      const input = document.getElementById('ai-prompt-input');
      const question = (presetText ?? input?.value ?? '').trim();
      state.aiQuestion = question;

      const flagged = state.records.filter((r) => evaluateAudit(r).risk !== 'low');
      const stats = getSummaryStats();

      if (question.includes('مصاريف') || question.includes('خصم') || question.toLowerCase().includes('deduct')) {
        const personalOrMissing = state.records.filter((r) => r.type === 'personal' || !r.hasInvoice);
        state.aiReply = personalOrMissing.length
          ? `المصاريف غير القابلة للخصم أو ذات خطر الاستبعاد (${personalOrMissing.length}):\n` +
            personalOrMissing.map((r) => `• ${r.name} (${r.invoice}) — ${t().money(evaluateAudit(r).totalAmount)}: ${evaluateAudit(r).finding}`).join('\n')
          : 'لا توجد حالياً مصاريف شخصية أو فاقدة للفاتورة في سجلاتكِ.';
      } else if (question.includes('نقد') || question.includes('سقف') || question.toLowerCase().includes('cash')) {
        const cashAlerts = state.records.filter((r) => r.payment === 'cash' && evaluateAudit(r).totalAmount > CASH_CEILING_DZD);
        state.aiReply = cashAlerts.length
          ? `تنبيهات الدفع النقدي التي تجاوزت السقف:\n` +
            cashAlerts.map((r) => `• ${r.name}: المبلغ ${t().money(evaluateAudit(r).totalAmount)}`).join('\n')
          : 'لا توجد معاملات نقدية تجاوزت السقف المحدد حالياً.';
      } else {
        state.aiReply = flagged.length
          ? `ملخص التدقيق (مؤشر الامتثال ${stats.indexPct}%):\nتم رصد ${flagged.length} معاملة معرضة للخطر بقيمة إجمالية ${t().money(stats.atRiskSum)}:\n` +
            flagged.map((r) => `• ${r.name} (${r.invoice}): ${evaluateAudit(r).finding}`).join('\n')
          : `ممتاز! مؤشر الامتثال ${stats.indexPct}% وجميع المعاملات مطابقة لقواعد الفحص.`;
      }

      if (question) logActivity(`سؤال المساعد: ${question}`);
      renderPage();
    }

    function readCalculatorForm() {
      const name = (document.getElementById('f-name')?.value || '').trim() || 'معاملة جديدة';
      const invoice = (document.getElementById('f-invoice')?.value || '').trim() || `INV-${Date.now().toString().slice(-4)}`;
      const type = document.getElementById('f-type')?.value || 'purchase_op';
      const payment = document.getElementById('f-payment')?.value || 'bank';
      const beforeTax = parseFloat(document.getElementById('f-before-tax')?.value) || 0;
      const rate = parseFloat(document.getElementById('f-tax-rate')?.value) || 0;
      const hasInvoice = Boolean(document.getElementById('f-has-invoice')?.checked);
      const raw = { name, invoice, type, payment, beforeTax, rate, hasInvoice };
      return { ...raw, audit: evaluateAudit(raw) };
    }

    function handleCalculateOnly() {
      state.lastAudit = readCalculatorForm();
      logActivity(`حساب وفحص: ${state.lastAudit.name}`);
      renderPage();
    }

    function handleSaveFromCalculator(e) {
      e.preventDefault();
      const entry = readCalculatorForm();
      state.records.unshift({
        id: Date.now(),
        name: entry.name,
        invoice: entry.invoice,
        beforeTax: entry.audit.beforeTax,
        rate: entry.audit.rate,
        type: entry.type,
        payment: entry.payment,
        hasInvoice: entry.hasInvoice
      });
      persistRecords();
      state.lastAudit = entry;
      logActivity(`حفظ معاملة: ${entry.name} (${entry.invoice})`);
      renderPage();
    }

    function deleteRecord(id) {
      state.records = state.records.filter((r) => r.id !== id);
      persistRecords();
      renderPage();
    }

    function toggleMenu(e) {
      if (e) e.stopPropagation();
      state.menuOpen = !state.menuOpen;
      renderMenuVisibility();
    }

    function closeMenu() {
      if (!state.menuOpen) return;
      state.menuOpen = false;
      renderMenuVisibility();
    }

    function renderMenuVisibility() {
      const menu = document.getElementById('more-menu');
      if (state.menuOpen) {
        menu.classList.remove('invisible', 'opacity-0', 'scale-95', 'pointer-events-none');
        menu.classList.add('visible', 'opacity-100', 'scale-100', 'pointer-events-auto');
      } else {
        menu.classList.add('invisible', 'opacity-0', 'scale-95', 'pointer-events-none');
        menu.classList.remove('visible', 'opacity-100', 'scale-100', 'pointer-events-auto');
      }
    }

    document.addEventListener('click', (e) => {
      const menu = document.getElementById('more-menu');
      const btn = document.getElementById('menu-btn');
      if (state.menuOpen && !menu.contains(e.target) && !btn.contains(e.target)) {
        closeMenu();
      }
    });

    function navigateTo(key) {
      state.page = key;
      closeMenu();
      logActivity(`الانتقال إلى صفحة: ${t().labels[key] || key}`);
      renderChrome();
      renderPage();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

      state.lang = lang;
      document.documentElement.lang = lang;

      renderPage();

    function toggleTheme() {
      state.dark = !state.dark;

    }

    function renderChrome() {
      document.getElementById('header-page-title').textContent = t().labels[state.page] || state.page;

      const menuContainer = document.getElementById('menu-items-container');
      menuContainer.innerHTML = menuExtraKeys.map((key) => {
        const active = state.page === key;

          <button onclick="navigateTo('${key}')" class="w-full flex items-center justify-between rounded-xl px-3.5 py-2.5 text-start text-sm font-semibold transition ${

            </span>
            <span class="text-xs opacity-60">›</span>
          </button>
        `;
      }).join('');

        const active = state.page === key;
        return `
          <button onclick="navigateTo('${key}')" class="min-w-[64px] flex-1 flex flex-col items-center justify-center gap-1 rounded-xl px-1.5 py-1.5 text-[10px] font-bold transition ${

          }">

              <div>
                <label class="block text-xs font-bold mb-1">${t().txType}</label>
                <select id="f-type" class="w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3.5 py-2 text-sm">
                  <option value="purchase_op">${t().types.purchase_op}</option>
                  <option value="sale">${t().types.sale}</option>
                  <option value="export">${t().types.export}</option>
                  <option value="personal">${t().types.personal}</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-bold mb-1">${t().beforeTax}</label>
                <input id="f-before-tax" type="number" step="0.01" min="0" required placeholder="10000" class="w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3.5 py-2 text-sm" />
              </div>
              <div>
                <label class="block text-xs font-bold mb-1">${t().taxRate}</label>
                <input id="f-tax-rate" type="number" step="0.01" min="0" required placeholder="19" class="w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3.5 py-2 text-sm" />
              </div>
              <div>
                <label class="block text-xs font-bold mb-1">${t().paymentMethod}</label>
                <select id="f-payment" class="w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3.5 py-2 text-sm">
                  <option value="bank">${t().payments.bank}</option>
                  <option value="cash">${t().payments.cash}</option>
                </select>
              </div>
              <div class="sm:col-span-2 flex items-center">
                <label class="flex items-center gap-2 text-xs font-bold cursor-pointer">
                  <input id="f-has-invoice" type="checkbox" checked class="h-4 w-4 rounded text-indigo-600" />
                  <span>${t().hasInvoiceLbl}</span>
                </label>
              </div>
              <div class="flex items-center gap-2.5">
                <button type="button" onclick="handleCalculateOnly()" class="flex-1 rounded-xl border border-indigo-600 bg-indigo-50 dark:bg-indigo-950/40 px-4 py-2.5 text-sm font-extrabold text-indigo-600">${t().calcBtn}</button>
                <button type="submit" class="flex-1 rounded-xl bg-indigo-600 px-4 py-2.5 text-sm font-extrabold text-white shadow hover:bg-indigo-700">${t().saveBtn}</button>
              </div>
            </form>
            ${preview}
          </section>
        `;
        return;
      }

      if (state.page === 'assistant') {
        container.innerHTML = `
          <section class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 shadow-sm space-y-4">
            <div>
              <h2 class="text-lg font-extrabold">صفحة المساعد الذكي للتدقيق الجبائي</h2>
              <p class="text-xs text-slate-500 dark:text-slate-400">مساحة مستقلة للمساعد الذكي لفحص المخالفات والمصاريف غير القابلة للخصم وتجاوز السقف النقدي.</p>
            </div>
            <div class="flex flex-wrap gap-2">
              <button type="button" onclick="askAssistantWithPrompt('ما هي المصاريف غير القابلة للخصم؟')" class="rounded-xl bg-slate-100 dark:bg-slate-800 px-3 py-1.5 text-xs font-bold hover:bg-slate-200 dark:hover:bg-slate-700">المصاريف غير القابلة للخصم</button>
              <button type="button" onclick="askAssistantWithPrompt('هل يوجد تجاوز لسقف الدفع النقدي؟')" class="rounded-xl bg-slate-100 dark:bg-slate-800 px-3 py-1.5 text-xs font-bold hover:bg-slate-200 dark:hover:bg-slate-700">فحص السقف النقدي</button>
              <button type="button" onclick="askAssistantWithPrompt('ملخص المخالفات الحالية')" class="rounded-xl bg-slate-100 dark:bg-slate-800 px-3 py-1.5 text-xs font-bold hover:bg-slate-200 dark:hover:bg-slate-700">ملخص المخالفات</button>
            </div>
            <div class="flex gap-2">
              <input id="ai-prompt-input" type="text" value="${state.aiQuestion}" placeholder="اكتبي سؤالكِ هنا..." class="flex-1 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3.5 py-2.5 text-sm" />
              <button type="button" onclick="askAssistantWithPrompt()" class="rounded-xl bg-indigo-600 px-5 py-2.5 text-sm font-extrabold text-white hover:bg-indigo-700">إرسال</button>
            </div>
            <div class="rounded-xl border border-indigo-200 dark:border-indigo-800 bg-indigo-50/60 dark:bg-indigo-950/30 p-4 text-xs sm:text-sm whitespace-pre-line leading-relaxed">${state.aiReply}</div>
          </section>
        `;
        return;
      }

      if (state.page === 'files') {
        container.innerHTML = `
          <section class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 shadow-sm space-y-4">
            <h2 class="text-lg font-extrabold">صفحة حفظ الملفات وتنزيلها</h2>
            <p class="text-xs text-slate-600 dark:text-slate-300">يتم حفظ سجلاتكِ تلقائياً في المتصفح، ويمكنكِ تنزيلها بصيغة CSV أو تقرير TXT أو نسخة JSON واستعادتها لاحقاً.</p>
            <div class="flex flex-wrap gap-2.5">
              <button type="button" onclick="downloadCSV()" class="rounded-xl bg-indigo-600 px-4 py-2.5 text-xs font-extrabold text-white hover:bg-indigo-700">تنزيل CSV</button>
              <button type="button" onclick="downloadReportTXT()" class="rounded-xl bg-cyan-600 px-4 py-2.5 text-xs font-extrabold text-white hover:bg-cyan-700">تنزيل تقرير TXT</button>
              <button type="button" onclick="downloadJSONBackup()" class="rounded-xl border border-indigo-600 px-4 py-2.5 text-xs font-extrabold text-indigo-600 dark:text-indigo-300">تنزيل نسخة JSON</button>
            </div>
            <div class="pt-2">
              <label class="block text-xs font-bold mb-1.5">استعادة ملف محفوظ (JSON)</label>
              <input type="file" accept="application/json,.json" onchange="handleJsonUpload(event)" class="block w-full text-xs text-slate-500 file:me-3 file:rounded-xl file:border-0 file:bg-slate-100 dark:file:bg-slate-800 file:px-3.5 file:py-2 file:text-xs file:font-bold" />
            </div>
          </section>
        `;
        return;
      }

      if (state.page === 'compliance') {
        container.innerHTML = `
          <section class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 shadow-sm space-y-4">
            <h2 class="text-lg font-extrabold">صفحة فحص الامتثال والمخاطر</h2>
            ${renderRecordsTable((r) => evaluateAudit(r).risk !== 'low')}
          </section>
        `;
        return;
      }

      if (state.page === 'reports') {
        container.innerHTML = `
          <section class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 shadow-sm space-y-3">
            <h2 class="text-lg font-extrabold">صفحة التقارير التحليلية</h2>
            <p class="text-xs text-slate-600 dark:text-slate-300">إجمالي الضرائب المحسوبة: <strong class="font-mono">${t().money(stats.totalTax)}</strong> | إجمالي المبالغ بعد الضريبة: <strong class="font-mono">${t().money(stats.totalTTC)}</strong> | إجمالي المبالغ المعرضة للخطر: <strong class="font-mono text-rose-600">${t().money(stats.atRiskSum)}</strong></p>
          </section>
        `;
        return;
      }

      if (state.page === 'regulations') {
        container.innerHTML = `
          <section class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 shadow-sm space-y-2">
            <h2 class="text-lg font-extrabold">صفحة اللوائح وقواعد الفحص</h2>
            <ul class="list-disc ps-5 text-xs sm:text-sm space-y-1.5 text-slate-700 dark:text-slate-300">
              <li>التحقق من توفر فاتورة رسمية مستوفاة الشروط لكل عملية.</li>
              <li>استبعاد المصاريف الشخصية من الخصم الضريبي.</li>
              <li>تنبيه المعاملات النقدية التي تتجاوز السقف المحدد.</li>
              <li>مقارنة نسب الضريبة حسب طبيعة العملية (مبيعات، مشتريات، تصدير).</li>
            </ul>
          </section>
        `;
        return;
      }

      if (state.page === 'deadlines') {
        container.innerHTML = `
          <section class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 shadow-sm space-y-2">
            <h2 class="text-lg font-extrabold">صفحة المواعيد الضريبية</h2>
            <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-300">يُستحسن تدقيق الفواتير والمعاملات ومعالجة التنبيهات قبل موعد التصريح الدوري بوقت كافٍ.</p>
          </section>
        `;
        return;
      }

      if (state.page === 'history') {
        container.innerHTML = `
          <section class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 shadow-sm space-y-3">
            <h2 class="text-lg font-extrabold">صفحة سجل الأنشطة</h2>
            <ul class="list-disc ps-5 text-xs sm:text-sm space-y-1 text-slate-700 dark:text-slate-300">
              ${state.activities.map((a) => `<li>${a}</li>`).join('')}
            </ul>
          </section>
        `;
        return;
      }

      container.innerHTML = `
        <section class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 shadow-sm space-y-4">
          <h2 class="text-lg font-extrabold">صفحة الإعدادات</h2>
          <p class="text-xs text-slate-600 dark:text-slate-300">يمكنكِ تغيير اللغة، العملة، أو المظهر من الشريط العلوي، أو استعادة البيانات الافتراضية أدناه.</p>
          <button type="button" onclick="resetSampleRecords()" class="rounded-xl border border-rose-500 px-4 py-2 text-xs font-extrabold text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/30">استعادة البيانات الافتراضية</button>
        </section>
      `;
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderChrome();
      renderPage();
      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        const app = document.getElementById('app-root');
        splash.style.opacity = '0';
        setTimeout(() => {
          splash.classList.add('hidden');
          app.classList.remove('hidden');
        }, 450);
      }, 2000);
    });
  </script>
</body>
</html>
